        <script>
            (function () {
                var redirect = sessionStorage.redirect;
                if (redirect) {
                    delete sessionStorage.redirect;
                    if (
                        redirect !==
                        window.location.pathname +
                            window.location.search +
                            window.location.hash
                    ) {
                        window.history.replaceState(null, '', redirect);
                    }
                }
            })();
        </script>
